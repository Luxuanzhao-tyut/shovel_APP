# 现场可调参数
# 修改后重启“露天矿电铲样机控制台”即可生效，不需要重新生成 UI。
# 速度接口按百分比工程值使用：100 表示 PLC 远程速度接口的 100% 给定。
speed:
  # 控制界面启动时默认显示的速度给定
  default_percent: 10.0

  # 控制界面允许输入的最大速度，同时也是程序后台的真实写入限幅。
  # 建议现场按 10 -> 20 -> 30 逐级验证，不要一次直接提高到 100。
  max_percent: 50.0

  # 速度输入框每次点击上下箭头的增量
  step_percent: 1.0

  # 自动到目标时允许设置的最小速度上限
  auto_min_percent: 1.0

# 机构限位方向与上位机监督保护
# 提升方向已由 2026-09-28 真机测试确认：提升时编码器下降，触发 lift_limit 后应禁止继续提升。
# 推压限位方向目前尚未完成同等级真机标定，默认按“推出端限位”处理；
# 如果现场确认实际是“收回端限位”，只需把 push_blocked_direction 改为 backward 后重启程序。
limits:
  auto_stop_on_limit: true
  lift_blocked_direction: up       # up=禁止提升；down=禁止下放
  push_blocked_direction: forward # forward=禁止推出；backward=禁止收回

# V2.3 连续挖掘轨迹控制参数
# 上位机位置外环输出“速度百分比给定”；电机速度内环仍由 PLC/驱动器完成。
trajectory_control:
  # 公共路径进度前方的参考点距离。越大越积极，越小越贴近实际进度。
  lookahead_fraction: 0.15
  # 中间途经点达到该共同进度后直接切到下一段，不在中间点停车。
  waypoint_switch_progress: 0.92
  # 克服机构低速死区的最小运动给定。最终进入位置容差后仍会置 0。
  min_moving_percent: 0.8
  # 速度变化小于此值时不重复写 PLC，减少无意义通信。
  speed_update_deadband_percent: 0.25
  # 旧版绝对 P 增益（保留兼容/对照；V2.3.2 连续轨迹默认改用按路径段尺度归一化的 P 外环）。
  lift_kp_percent_per_count: 0.010
  push_kp_percent_per_count: 0.010
  swing_kp_percent_per_deg: 0.50

  # 路径跟踪阶段只使用最终到位容差的一部分作为死区，避免短前视启动锁死。
  tracking_tolerance_factor: 0.25
  # 启动/短段前视至少跨过最终容差的倍数。
  bootstrap_tolerance_margin: 1.5

  # 最终点滞环释放倍数：进入 ±容差后保持停止，漂移超过 2×容差才重新纠偏。
  # 当前对应提升/推压约 ±40 编码器、回转约 ±2°。
  final_hold_release_factor: 2.0
